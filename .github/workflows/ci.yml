name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libwayland-dev libwlroots-0.20-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libdrm-dev libgbm-dev libegl-dev libgles2-dev \
            libpixman-1-dev libpng-dev libjpeg-dev \
            libfreetype6-dev libjsoncpp-dev \
            libcurl4-openssl-dev libglib2.0-dev \
            libpixman-1-dev \
            nlohmann-json3-dev \
            libglib2.0-dev \
            wayland-protocols \
            wayland-scanner \
            libgtest-dev \
            python3 python3-pip \
            grim slurp foot alacritty

      - name: Build and run tests
        run: |
          ./build.sh
          ./build/test-scene-graph
          ./build/test-utilities
          ./build/test-keybinding
          bash tests/runtime/run_runtime_tests.sh